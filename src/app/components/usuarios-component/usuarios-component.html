<div class="container mt-4">
     <h2>Lista de Usuarios</h2>

  <table class="table table-striped table-bordered">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Saldo</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let usuario of usuarios">
       <td>{{ usuario.id }}</td>
       <td>{{ usuario.nombre }}</td>
        <td>{{ usuario.email }}</td>
        <td>{{ usuario.rol }}</td>
        <td>${{ usuario.saldo }}</td>
      </tr>
    </tbody>

</table>

</div>
