<div class="container" style="max-width: 400px">
 <form #formLogin="ngForm" (ngSubmit)="login(formLogin)">
 <label for="email">Correo</label>
 <input type="email" id="email" name="email" class="form-control" ngModel required />
 <label for="password" class="mt-2">Ingrese contraseña</label>
 <input type="password" id="password" name="password" class="form-control" ngModel required /> <p class="text-danger mt-2" *ngIf="errorMensaje">{{ errorMensaje }}</p>
 <button type="submit" class="btn btn-primary mt-3">Acceder</button>
 </form>
</div>
